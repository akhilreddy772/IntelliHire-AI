{% extends "base.html" %}

{% block title %}Register Account — IntelliHire AI{% endblock %}

{% block body %}
<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-header">
      <div class="logo" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 24px;">⚡</div>
      <h2>Create Your Account</h2>
      <p class="mut">Join IntelliHire AI as a Recruiter or Candidate</p>
    </div>

    <form method="post" class="auth-form">
      <div class="input-group">
        <label class="input-label" for="username">Choose a Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Your name or handle" required autofocus>
      </div>

      <div class="input-group" style="margin-top: 14px;">
        <label class="input-label" for="password">Choose a Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" required>
      </div>

      <div class="input-group" style="margin-top: 14px;">
        <label class="input-label" for="role">Account Role</label>
        <select id="role" name="role" class="form-control">
          <option value="recruiter">Recruiter / Hiring Manager (Full Workspace Access)</option>
          <option value="candidate">Candidate (Self-Service Evaluation)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-lg" style="width: 100%; justify-content: center; margin-top: 20px;">
        Complete Registration
      </button>

      <div class="auth-footer" style="margin-top: 20px; text-align: center;">
        <span class="mut" style="font-size: 13px;">Already registered?</span>
        <a href="{{ url_for('login') }}" class="lnk">Sign in here →</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
