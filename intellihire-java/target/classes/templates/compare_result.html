<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Compare Result</title></head>
<body>
<div layout:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Resume Comparison</h1>
    <a th:href="@{/compare}" class="btn">← Compare Again</a>
  </div>

  <div class="compare-top">
    <!-- Candidate 1 -->
    <div class="card compare-col">
      <h3 th:text="${candidate1.name}">C1</h3>
      <div class="score-big-inline" th:text="${candidate1.score + '/100'}">0</div>
      <canvas id="radar1" height="200"></canvas>
      <div class="skill-pills">
        <span th:each="s : ${onlyIn1}" class="skill-pill skill-matched" th:text="${s}">s</span>
      </div>
      <p class="muted">Skills unique to this candidate</p>
    </div>

    <!-- Common -->
    <div class="card compare-col compare-middle">
      <h3>🤝 Common</h3>
      <div class="skill-pills">
        <span th:each="s : ${commonSkills}" class="skill-pill" th:text="${s}">s</span>
      </div>
      <p class="muted" th:text="${#lists.size(commonSkills) + ' shared skills'}"></p>
    </div>

    <!-- Candidate 2 -->
    <div class="card compare-col">
      <h3 th:text="${candidate2.name}">C2</h3>
      <div class="score-big-inline" th:text="${candidate2.score + '/100'}">0</div>
      <canvas id="radar2" height="200"></canvas>
      <div class="skill-pills">
        <span th:each="s : ${onlyIn2}" class="skill-pill skill-missing" th:text="${s}">s</span>
      </div>
      <p class="muted">Skills unique to this candidate</p>
    </div>
  </div>

  <script th:inline="javascript">
    const bd1 = /*[[${result1.scoreBreakdown}]]*/ {};
    const bd2 = /*[[${result2.scoreBreakdown}]]*/ {};
    const labels = Object.keys(bd1).map(k => k.replace(/([A-Z])/g,' $1').trim());

    function makeRadar(id, data, label, color) {
      new Chart(document.getElementById(id), {
        type:'radar',
        data:{ labels, datasets:[{ label, data: Object.values(data), backgroundColor: color+'33', borderColor: color, pointBackgroundColor: color }] },
        options:{ scales:{ r:{ beginAtZero:true, max:25 } }, plugins:{ legend:{ display:false } } }
      });
    }
    makeRadar('radar1', bd1, /*[[${candidate1.name}]]*/ 'C1', '#6366f1');
    makeRadar('radar2', bd2, /*[[${candidate2.name}]]*/ 'C2', '#22c55e');
  </script>
</div>
</body>
</html>
