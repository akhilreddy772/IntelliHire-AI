<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Post a Job</title></head>
<body>
<div layout:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Post a Custom Job</h1>
    <p class="page-subtitle">Add a job opening to match against uploaded resumes</p>
  </div>
  <div class="card" style="max-width:700px">
    <form method="post" th:action="@{/custom-job}" class="job-form">
      <div class="form-row">
        <div class="form-group"><label>Job Title *</label>
          <input type="text" name="title" class="form-input" required placeholder="e.g. Senior Python Developer"/></div>
        <div class="form-group"><label>Company *</label>
          <input type="text" name="company" class="form-input" required placeholder="e.g. TechCorp"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Location</label>
          <input type="text" name="location" class="form-input" placeholder="Remote / City, Country"/></div>
        <div class="form-group"><label>Job Type</label>
          <select name="type" class="form-input">
            <option>Full-time</option><option>Part-time</option>
            <option>Contract</option><option>Internship</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>Salary Range</label>
        <input type="text" name="salary" class="form-input" placeholder="e.g. ₹8-12 LPA or $80k-$100k"/></div>
      <div class="form-group"><label>Job Description *</label>
        <textarea name="description" class="form-input" rows="5" required
                  placeholder="Describe the role, responsibilities and requirements..."></textarea></div>
      <div class="form-group"><label>Required Skills (comma-separated) *</label>
        <input type="text" name="skills" class="form-input" required
               placeholder="Python, Django, PostgreSQL, Docker, AWS"/></div>
      <button type="submit" class="btn btn-primary">Post Job Opening</button>
    </form>
  </div>
</div>
</body>
</html>
