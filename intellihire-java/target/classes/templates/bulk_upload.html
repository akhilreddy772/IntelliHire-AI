<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Bulk Upload</title></head>
<body>
<div layout:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Bulk Resume Upload</h1>
    <p class="page-subtitle">Upload multiple resumes at once and get a ranked leaderboard</p>
  </div>
  <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>
  <div class="card">
    <form method="post" th:action="@{/bulk-upload}" enctype="multipart/form-data">
      <div class="drop-zone" onclick="document.getElementById('bulkInput').click()">
        <div class="drop-icon">📦</div>
        <div class="drop-text">Drop multiple resume files here</div>
        <div class="drop-sub">or click to select files</div>
        <div class="drop-formats">PDF · DOCX · TXT — Max 8 MB each</div>
        <input type="file" id="bulkInput" name="files" multiple
               accept=".pdf,.docx,.txt" style="display:none"
               onchange="showCount(this)"/>
      </div>
      <div id="fileCount" style="text-align:center;margin:.5rem 0;color:#6366f1"></div>
      <button type="submit" class="btn btn-primary btn-full" style="margin-top:1rem">
        🚀 Analyze All Resumes
      </button>
    </form>
  </div>
  <script>
    function showCount(input) {
      document.getElementById('fileCount').textContent = input.files.length + ' file(s) selected';
    }
  </script>
</div>
</body>
</html>
