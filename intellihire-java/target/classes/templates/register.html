<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Register — IntelliHire AI</title>
  <link rel="stylesheet" th:href="@{/static/style.css}"/>
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon" style="font-size:2rem;padding:1rem">IH</div>
    <h1>Create Account</h1>
  </div>

  <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>

  <form method="post" th:action="@{/register}" class="auth-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" class="form-input" required minlength="3"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" class="form-input" required minlength="6"/>
    </div>
    <div class="form-group">
      <label>Role</label>
      <select name="role" class="form-input">
        <option value="candidate">Candidate</option>
        <option value="recruiter">Recruiter</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary btn-full">Create Account</button>
  </form>
  <p class="auth-link">Already have an account? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
