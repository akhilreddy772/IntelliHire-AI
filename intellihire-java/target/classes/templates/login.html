<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Login — IntelliHire AI</title>
  <link rel="stylesheet" th:href="@{/static/style.css}"/>
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon" style="font-size:2rem;padding:1rem">IH</div>
    <h1>IntelliHire AI</h1>
    <p>Intelligent Resume Analyzer</p>
  </div>

  <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>
  <div th:if="${success}" class="flash flash-success" th:text="${success}"></div>

  <form method="post" th:action="@{/login}" class="auth-form">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" class="form-input" placeholder="recruiter" required autofocus/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" class="form-input" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn btn-primary btn-full">Login →</button>
  </form>

  <p class="auth-link">No account? <a th:href="@{/register}">Register</a></p>

  <div class="demo-creds">
    <strong>Demo accounts:</strong><br/>
    recruiter / recruiter123 &nbsp;|&nbsp; candidate / candidate123
  </div>
</div>
</body>
</html>
