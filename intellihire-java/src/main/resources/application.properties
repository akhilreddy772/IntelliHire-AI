# ── Server ────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Thymeleaf ─────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── File Upload (8 MB max, same as Python version) ────────────
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
spring.servlet.multipart.enabled=true

# ── Database: SQLite fallback (auto-created) ──────────────────
# Override with MYSQL_URL or DATABASE_URL env vars for production
app.datasource.sqlite-path=${SQLITE_PATH:data/intellihire.db}
app.datasource.mysql-url=${MYSQL_URL:}
app.datasource.mysql-user=${MYSQL_USER:root}
app.datasource.mysql-password=${MYSQL_PASSWORD:}

# ── Upload directory ──────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:uploads}

# ── Secret key for session signing ────────────────────────────
app.secret-key=${SECRET_KEY:intellihire-dev-secret-2026}

# ── Logging ───────────────────────────────────────────────────
logging.level.com.intellihire=INFO
logging.level.root=WARN
