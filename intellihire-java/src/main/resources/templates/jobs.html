<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Job Openings</title></head>
<body>
<div layout:fragment="content">

  <div th:if="${success}" class="flash flash-success" th:text="${success}"></div>

  <div class="page-header">
    <h1 class="page-title">Job Openings</h1>
    <a th:href="@{/custom-job}" class="btn btn-primary">+ Post a Job</a>
  </div>

  <div class="jobs-grid">
    <div th:each="job : ${jobs}" class="job-card">
      <div class="job-card-header">
        <div>
          <div class="job-title" th:text="${job.title}">Title</div>
          <div class="job-company" th:text="${job.company}">Company</div>
        </div>
        <span th:if="${job.custom}" class="badge-custom">Custom</span>
      </div>
      <div class="job-meta-row">
        <span>📍 <span th:text="${job.location}">Location</span></span>
        <span>🕐 <span th:text="${job.type}">Type</span></span>
        <span>💰 <span th:text="${job.salary}">Salary</span></span>
      </div>
      <p class="job-desc" th:text="${#strings.abbreviate(job.description, 150)}">Desc</p>
      <div class="skill-pills" style="margin-top:0.5rem">
        <span th:each="skill : ${job.requiredSkills}" class="skill-pill" th:text="${skill}">skill</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
