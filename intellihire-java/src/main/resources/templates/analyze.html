<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Analyze Resume</title></head>
<body>
<div layout:fragment="content">

  <div th:if="${error}" class="flash flash-error" th:text="${error}"></div>

  <div class="page-header">
    <h1 class="page-title">Analyze Resume</h1>
    <p class="page-subtitle">Upload a PDF, DOCX, or TXT file — or paste your resume text below</p>
  </div>

  <div class="analyze-grid">

    <!-- Upload card -->
    <div class="card">
      <h3 class="card-title">📂 Upload Resume File</h3>
      <form method="post" th:action="@{/analyze}" enctype="multipart/form-data" id="uploadForm">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <div class="drop-icon">📄</div>
          <div class="drop-text">Drag &amp; drop your resume here</div>
          <div class="drop-sub">or click to browse</div>
          <div class="drop-formats">PDF · DOCX · TXT · Max 8 MB</div>
          <input type="file" id="fileInput" name="file"
                 accept=".pdf,.docx,.txt" style="display:none"
                 onchange="showFileName(this)"/>
        </div>
        <div id="fileName" class="file-name-label" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:1rem">
          🚀 Analyze Resume
        </button>
      </form>
    </div>

    <!-- Paste card -->
    <div class="card">
      <h3 class="card-title">✏️ Paste Resume Text</h3>
      <form method="post" th:action="@{/analyze}">
        <textarea name="pastedText" class="paste-area"
                  placeholder="Paste your full resume text here..." rows="12"></textarea>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:0.75rem">
          🚀 Analyze Text
        </button>
      </form>
    </div>

  </div>

  <script>
    function showFileName(input) {
      if (input.files && input.files[0]) {
        document.getElementById('fileName').style.display = 'block';
        document.getElementById('fileName').textContent = '📎 ' + input.files[0].name;
      }
    }
    const dz = document.getElementById('dropZone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('drag-over');
      const f = e.dataTransfer.files[0];
      if (f) { document.getElementById('fileInput').files = e.dataTransfer.files; showFileName(document.getElementById('fileInput')); }
    });
  </script>
</div>
</body>
</html>
