<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Bulk Results</title></head>
<body>
<div layout:fragment="content">
  <div class="page-header">
    <h1 class="page-title">Bulk Upload Results</h1>
    <a th:href="@{/bulk-upload}" class="btn">← Upload More</a>
  </div>

  <div th:if="${!errors.isEmpty()}" class="flash flash-error">
    <strong>Errors:</strong>
    <ul><li th:each="e : ${errors}" th:text="${e}">error</li></ul>
  </div>

  <div class="card">
    <h3 class="card-title">🏆 Candidate Leaderboard (<span th:text="${#lists.size(results)}">0</span> resumes)</h3>
    <table class="data-table">
      <thead>
        <tr><th>#</th><th>Candidate</th><th>Score</th><th>Best Role Match</th><th>Skills</th><th>File</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="row,stat : ${results}">
          <td><strong th:text="${stat.index + 1}">1</strong></td>
          <td th:text="${row.name}">Name</td>
          <td>
            <span class="score-badge" th:text="${row.score + '/100'}"
                  th:style="'background:' + ${(int)row.score >= 75 ? '#22c55e' : (int)row.score >= 50 ? '#f59e0b' : '#ef4444'}">0</span>
          </td>
          <td th:text="${row.topJob + ' ' + row.topMatch + '%'}">Role</td>
          <td th:text="${row.skills + ' skills'}">0</td>
          <td th:text="${row.filename}">file.pdf</td>
          <td><a th:href="@{'/result/' + ${row.id}}" class="btn btn-sm">View</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
